[project]
name = "cad-converter"
version = "0.1.0"
description = "CAD tessellation service: STEP/IGES/mesh -> glb + metadata"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # numpy is a base dependency, not part of [cad]: the conversion module
    # imports it at module level and the API imports that module for its
    # readiness check, so the service must be able to load it without OCCT.
    "numpy>=2.0",
    # The worker talks to the same Postgres and object storage the web app
    # uses. Both are in the base install because the worker module imports
    # them at load time and CI must be able to import it without OCCT.
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    # The mesh import path is core functionality, not part of the optional CAD
    # toolchain: STL and OBJ need no OCCT. Keeping trimesh in the base install
    # is what lets CI run those tests.
    "trimesh>=4.5",
    # Reading DXF drawings. In the base install for the same reason as trimesh:
    # everything that decides what a drawing means -- which line is the axis,
    # which outline is the part -- is plain geometry and is tested in CI. Only
    # the revolve at the end needs OCCT.
    "ezdxf>=1.3",
    # Reading printed drawings. In the base install for the same reason as
    # ezdxf: it is pure Python, and everything it feeds -- which line is the
    # axis, which outline is the part -- is what has to be covered in CI.
    "pdfminer.six>=20240706",
]

[project.optional-dependencies]
# OCCT is deliberately kept out of the default install: it is a large,
# platform-sensitive dependency and CI does not need it to lint or to run the
# tests that do not touch geometry. Installed in the Docker image and in the
# local dev environment once the week-1 spike lands.
cad = [
    "cadquery-ocp>=7.7",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    # Only `scripts/make_fixture.py` needs this, to print the DXF fixtures to
    # PDF. Nothing the service runs imports it.
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
